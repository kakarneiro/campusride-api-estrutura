spring.application.name=campusride-api

# Banco H2 em memoria (recriado a cada execucao)
spring.datasource.url=jdbc:h2:mem:campusride
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Evita consultas ao banco durante a renderizacao da resposta
spring.jpa.open-in-view=false
